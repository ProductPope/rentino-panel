name: Registry drift

# Re-installs every @eq component and fails on any difference. Weekly (catches new EQ-librium
# releases without blocking other PRs) and on demand. On pull requests that touch registry code the
# same check runs inside CI (ci.yml), so it does not cost a separate job.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    name: Components match @eq registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-registry.sh
