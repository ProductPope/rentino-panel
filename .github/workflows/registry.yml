name: Registry drift

# Re-installs every @eq component and fails on any difference. Runs when registry code is touched
# (catches local edits) and weekly (catches new EQ-librium releases without blocking other PRs).
on:
  pull_request:
    paths:
      - "src/components/ui/**"
      - "src/components/eq/**"
      - "src/hooks/**"
      - "src/lib/utils.ts"
      - "components.json"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    name: Components match @eq registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-registry.sh
